<button id="k_{{ letter }}"
        {% if mode == 'input' %} hx-target="#input" {% else %} hx-target="#k_{{ letter }}" {% endif %}
        hx-swap="outerHTML"
        hx-trigger="click"
        hx-get="/keyboard_clicked"
        hx-vals='{"letter": "{{ letter }}"}'
        class="key highlight-{{ color }}">
  {{ letter }}
</button>
